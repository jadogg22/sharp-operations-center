x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # .env beside docker-compose.yml feeds both compose interpolation and the
      # backend container. With DATA_MODE=production plus SQL_* credentials and
      # FLEET_COST_CATEGORIES it serves live data; otherwise the demo database.
      DATA_MODE: ${DATA_MODE:-demo}
      DEMO_DATABASE_PATH: /app/data/sharp_demo.sqlite3
    env_file:
      - .env
    volumes:
      - demo-data:/app/data
      - ./sql:/app/sql:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

volumes:
  demo-data:
